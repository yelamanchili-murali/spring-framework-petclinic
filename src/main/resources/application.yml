# Spring Boot Configuration for PetClinic Application
# Migrated from Spring MVC XML configuration

spring:
  application:
    name: petclinic
  profiles:
    active: spring-data-jpa  # Default to Spring Data JPA implementation
  
  # JSP Configuration for embedded Tomcat
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none # Don't auto-generate schema, use schema.sql instead
    open-in-view: true # Matches legacy behavior
    show-sql: false # Will be overridden in dev profile
    
  # Datasource Configuration (default H2)
  datasource:
    url: jdbc:h2:mem:petclinic
    username: sa
    password:
    driver-class-name: org.h2.Driver
    
  # Initialize database with schema and data
  sql:
    init:
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql
      mode: embedded
      
  # Cache Configuration
  cache:
    type: caffeine
    cache-names:
      - vets
    caffeine:
      spec: maximumSize=10000,expireAfterAccess=600s

  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: when-authorized

# Logging Configuration
logging:
  level:
    org.springframework.samples.petclinic: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    
# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
    
---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      format_sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      
---      
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    
---
# Production Profile  
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  logging:
    level:
      org.springframework.samples.petclinic: WARN
      
---
# MySQL Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/petclinic?useUnicode=true
    username: petclinic
    password: petclinic
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      schema-locations: classpath:db/mysql/schema.sql
      data-locations: classpath:db/mysql/data.sql
      
---
# PostgreSQL Profile
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/petclinic
    username: postgres
    password: petclinic
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      schema-locations: classpath:db/postgresql/schema.sql
      data-locations: classpath:db/postgresql/data.sql